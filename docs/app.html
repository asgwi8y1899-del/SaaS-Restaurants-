<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DineOS — Dashboard</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0b0f19;--bg2:#111827;--card:#1a2235;--accent:#f97316;--accent2:#fb923c;--text:#f1f5f9;--muted:#94a3b8;--border:#263248;--green:#22c55e;--red:#ef4444;--blue:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.7}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.btn{display:inline-block;padding:10px 22px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;border:none;transition:.25s;color:#fff}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(249,115,22,.3)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-green{background:var(--green)}
.btn-red{background:var(--red);padding:5px 12px;font-size:12px;border-radius:8px}
.btn-blue{background:var(--blue);padding:5px 12px;font-size:12px;border-radius:8px}
input,select{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px;width:min(420px,100%);text-align:center}
.logo{font-size:26px;font-weight:800;color:var(--accent)}
.logo span{color:var(--text)}
.login-box p{color:var(--muted);font-size:14px;margin-bottom:22px}
.login-box label{display:block;text-align:left;font-size:13px;color:var(--muted);margin:14px 0 6px}
/* app */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--bg2);border-right:1px solid var(--border);padding:24px 16px;position:sticky;top:0;height:100vh;flex-shrink:0}
.sidebar .logo{display:block;text-align:center;margin-bottom:30px}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--muted);cursor:pointer;font-size:15px;font-weight:600;margin-bottom:6px;transition:.2s}
.menu-item:hover{background:var(--card);color:var(--text)}
.menu-item.active{background:rgba(249,115,22,.12);color:var(--accent)}
.main{flex:1;padding:32px;overflow-x:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.topbar h2{font-size:24px}
.topbar small{color:var(--muted)}
.pill{padding:4px 14px;border-radius:999px;font-size:12px;font-weight:700}
.pill.g{background:rgba(34,197,94,.15);color:var(--green)}
.pill.o{background:rgba(249,115,22,.15);color:var(--accent)}
.pill.b{background:rgba(59,130,246,.15);color:var(--blue)}
.pill.r{background:rgba(239,68,68,.15);color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.stat b{font-size:24px;display:block}
.stat small{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;margin-bottom:24px}
.panel h3{margin-bottom:18px;font-size:18px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:13px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end;margin-bottom:18px}
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding:20px;background:var(--bg);border:1px solid var(--border);border-radius:14px}
.bar{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent),rgba(249,115,22,.15));position:relative}
.bar span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border:none}
.set-row span{color:var(--muted);font-size:13px}
.switch{width:52px;height:28px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;transition:.3s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(24px)}
.stock-low{color:var(--red);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px}
.loading{color:var(--muted);padding:40px;text-align:center}
@media(max-width:900px){.sidebar{width:70px;padding:20px 8px}.sidebar .logo{font-size:18px}.menu-item{justify-content:center}.menu-item .txt{display:none}.stats{grid-template-columns:repeat(2,1fr)}.main{padding:18px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-wrap hidden">
  <div class="login-box">
    <div class="logo" style="font-size:34px">Dine<span>OS</span></div>
    <h2 style="margin:16px 0 6px">Welcome back</h2>
    <p>Sign in to your restaurant dashboard</p>

    <div style="display:flex;gap:8px;margin-bottom:18px">
      <button type="button" class="btn btn-ghost" id="tab-user" style="flex:1" onclick="loginTab('user')">👤 Username</button>
      <button type="button" class="btn btn-ghost" id="tab-phone" style="flex:1" onclick="loginTab('phone')">📱 Phone</button>
      <button type="button" class="btn btn-ghost" id="tab-google" style="flex:1" onclick="loginTab('google')">G Google</button>
    </div>

    <!-- Username + password -->
    <form id="form-user" onsubmit="return doLogin(event)">
      <label>Username</label><input id="lusername" placeholder="your_username" required>
      <label>Password</label><input id="lpass" type="password" placeholder="••••••••" required>
      <div class="err" id="lerr"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:12px">Sign in →</button>
      <p style="margin-top:14px;font-size:13px">New here? <a href="#" style="color:var(--accent)" onclick="return doRegister()">Create an account</a></p>
    </form>

    <!-- Phone + OTP -->
    <form id="form-phone" class="hidden" onsubmit="return sendOtp(event)">
      <label>Phone number</label><input id="lphone" placeholder="+9665xxxxxxxx" required>
      <label>Receive code via</label>
      <div style="display:flex;gap:8px;margin-top:4px">
        <label style="display:flex;align-items:center;gap:6px;flex:1;border:1px solid var(--border);border-radius:10px;padding:10px"><input type="radio" name="otpch" value="whatsapp" checked style="width:auto"> 📱 WhatsApp</label>
        <label style="display:flex;align-items:center;gap:6px;flex:1;border:1px solid var(--border);border-radius:10px;padding:10px"><input type="radio" name="otpch" value="sms" style="width:auto"> 💬 SMS</label>
      </div>
      <div class="err" id="perr"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:12px">Send code →</button>
    </form>
    <form id="form-otp" class="hidden" onsubmit="return verifyOtp(event)">
      <label>Enter the code sent to you</label><input id="lotp" placeholder="6-digit code" required>
      <div class="err" id="oerr"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:12px">Verify & sign in →</button>
    </form>

    <!-- Google -->
    <div id="form-google" class="hidden" style="text-align:center">
      <div id="google-btn-slot"></div>
      <p id="gerr" class="err"></p>
    </div>

    <p style="margin-top:18px;font-size:13px"><a href="/" style="color:var(--accent)">← Back to site</a></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="logo">Dine<span>OS</span></div>
    <div class="menu-item active" data-page="dashboard" onclick="goPage(this)">📊 <span class="txt">Dashboard</span></div>
    <div class="menu-item" data-page="orders" onclick="goPage(this)">🧾 <span class="txt">Orders</span></div>
    <div class="menu-item" data-page="menu" onclick="goPage(this)">🍔 <span class="txt">Menu</span></div>
    <div class="menu-item" data-page="inventory" onclick="goPage(this)">📦 <span class="txt">Inventory</span></div>
    <div class="menu-item" data-page="staff" onclick="goPage(this)">👥 <span class="txt">Staff</span></div>
    <div class="menu-item" data-page="reports" onclick="goPage(this)">📈 <span class="txt">Reports</span></div>
    <div class="menu-item" data-page="settings" onclick="goPage(this)">⚙️ <span class="txt">Settings</span></div>
    <div class="menu-item" onclick="logout()" style="margin-top:30px;color:var(--red)">🚪 <span class="txt">Logout</span></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h2 id="page-title">Dashboard</h2><small id="page-sub">Overview of today</small></div>
      <span class="pill g">PRO PLAN</span>
    </div>
    <div id="page-content"><div class="loading">Loading…</div></div>
  </main>
</div>

<script>
let token = localStorage.getItem('dineos_token');

async function api(path, opts = {}) {
  opts.headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) opts.headers.Authorization = 'Bearer ' + token;
  const r = await fetch('/api' + path, opts);
  if (r.status === 401) { logout(); return null; }
  return r.json();
}
const fmt = n => (+n).toFixed(2);
const $ = id => document.getElementById(id);

function showLogin(){ $('login').classList.remove('hidden'); $('app').classList.add('hidden'); loginTab('user'); }
function showApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); }
function logout(){ localStorage.removeItem('dineos_token'); token = null; showLogin(); }

function loginSuccess(d) {
  token = d.token; localStorage.setItem('dineos_token', token); showApp(); render('dashboard');
}

/* ---- tabs ---- */
function loginTab(which) {
  ['user', 'phone', 'google'].forEach(t => {
    $('tab-' + t).classList.toggle('btn-primary', t === which);
    $('tab-' + t).classList.toggle('btn-ghost', t !== which);
  });
  $('form-user').classList.toggle('hidden', which !== 'user');
  $('form-phone').classList.toggle('hidden', which !== 'phone');
  $('form-otp').classList.add('hidden');
  $('form-google').classList.toggle('hidden', which !== 'google');
  if (which === 'google') initGoogle();
}

/* ---- 1) username + password ---- */
async function doLogin(e) {
  e.preventDefault();
  $('lerr').textContent = '';
  const d = await api('/login', { method: 'POST', body: JSON.stringify({ username: $('lusername').value, pass: $('lpass').value }) });
  if (d && d.token) loginSuccess(d);
  else $('lerr').textContent = (d && d.error) ? d.error : 'Login failed';
  return false;
}
async function doRegister() {
  $('lerr').textContent = '';
  const username = $('lusername').value.trim(), pass = $('lpass').value;
  if (!username || !pass) { $('lerr').textContent = 'Enter a username & password first'; return false; }
  const d = await api('/register', { method: 'POST', body: JSON.stringify({ username, pass }) });
  if (d && d.token) loginSuccess(d);
  else $('lerr').textContent = (d && d.error) ? d.error : 'Registration failed';
  return false;
}

/* ---- 2) phone + OTP (WhatsApp or SMS) ---- */
let otpPhone = '';
async function sendOtp(e) {
  e.preventDefault();
  $('perr').textContent = '';
  otpPhone = $('lphone').value.trim();
  const channel = document.querySelector('input[name=otpch]:checked').value;
  const d = await api('/auth/otp/send', { method: 'POST', body: JSON.stringify({ phone: otpPhone, channel }) });
  if (d && d.ok) {
    $('form-phone').classList.add('hidden'); $('form-otp').classList.remove('hidden');
    if (d.dev) $('oerr').textContent = 'Dev mode: check server console for the code (no SMS/WhatsApp credentials set yet)';
  } else $('perr').textContent = (d && d.error) ? d.error : 'Could not send code';
  return false;
}
async function verifyOtp(e) {
  e.preventDefault();
  $('oerr').textContent = '';
  const d = await api('/auth/otp/verify', { method: 'POST', body: JSON.stringify({ phone: otpPhone, code: $('lotp').value.trim() }) });
  if (d && d.token) loginSuccess(d);
  else $('oerr').textContent = (d && d.error) ? d.error : 'Invalid code';
  return false;
}

/* ---- 3) Google Sign-In ---- */
let googleInited = false;
function initGoogle() {
  if (googleInited) return;
  if (typeof google === 'undefined' || !google.accounts) { $('gerr').textContent = 'Google sign-in script failed to load'; return; }
  // Set your GOOGLE_CLIENT_ID here (must match the server's GOOGLE_CLIENT_ID env var)
  const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential });
  google.accounts.id.renderButton($('google-btn-slot'), { theme: 'filled_black', size: 'large', width: 320 });
  googleInited = true;
}
async function onGoogleCredential(resp) {
  $('gerr').textContent = '';
  const d = await api('/auth/google', { method: 'POST', body: JSON.stringify({ credential: resp.credential }) });
  if (d && d.token) loginSuccess(d);
  else $('gerr').textContent = (d && d.error) ? d.error : 'Google sign-in failed';
}

function goPage(el) {
  document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
  el.classList.add('active');
  render(el.dataset.page);
}

const TITLES = {
  dashboard: ['Dashboard', 'Overview of today'],
  orders: ['Orders', 'POS & order management'],
  menu: ['Menu', 'Items & pricing'],
  inventory: ['Inventory', 'Stock & ingredients'],
  staff: ['Staff', 'Team & shifts'],
  reports: ['Reports', 'Sales & insights'],
  settings: ['Settings', 'Configure your workspace']
};

async function render(page) {
  const [t, s] = TITLES[page];
  $('page-title').textContent = t;
  $('page-sub').textContent = s;
  $('page-content').innerHTML = '<div class="loading">Loading…</div>';
  const h = await PAGES[page]();
  if (h) $('page-content').innerHTML = h;
}

function ordersTable(list) {
  if (!list || !list.length) return '<div class="empty">No orders yet</div>';
  const sc = { New: 'b', Preparing: 'o', Done: 'g', Cancelled: 'r' };
  return `<table><tr><th>#</th><th>Item</th><th>Qty</th><th>Total</th><th>Type</th><th>Status</th><th></th></tr>
  ${list.map(o => `<tr><td>${o.id}</td><td>${o.item}</td><td>${o.qty}</td><td>$${fmt(o.total)}</td><td>${o.type}</td>
  <td><span class="pill ${sc[o.status]}">${o.status}</span></td>
  <td>${o.status === 'New' ? `<button class="btn btn-blue" onclick="advOrder(${o.id})">Next →</button>` : ''}
  ${o.status !== 'Done' ? `<button class="btn btn-red" onclick="cancelOrder(${o.id})">✕</button>` : ''}</td></tr>`).join('')}</table>`;
}

function chartHTML(weekly) {
  const max = Math.max(...weekly, 1);
  const days = ['-6', '-5', '-4', '-3', '-2', 'Yday', 'Today'];
  return `<div class="chart">${weekly.map((v, i) => `<div class="bar" style="height:${Math.max(4, v / max * 100)}%"><span>$${v}</span></div>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px;padding:0 4px">${days.map(d => `<span>${d}</span>`).join('')}</div>`;
}

const PAGES = {
  dashboard: async () => {
    const s = await api('/stats');
    return `<div class="stats">
      <div class="stat"><b>$${fmt(s.revenue)}</b><small>Total revenue</small></div>
      <div class="stat"><b>${s.orders}</b><small>Orders</small></div>
      <div class="stat"><b>${s.staff}</b><small>Team members</small></div>
      <div class="stat"><b style="color:${s.low ? 'var(--red)' : 'inherit'}">${s.low}</b><small>Low-stock items</small></div>
    </div>
    <div class="panel"><h3>Sales — last 7 days</h3>${chartHTML(s.weekly)}</div>
    <div class="panel"><h3>Latest orders</h3>${ordersTable(s.recent)}</div>`;
  },
  orders: async () => {
    const [menu, orders] = await Promise.all([api('/menu'), api('/orders')]);
    return `<div class="panel"><h3>New order</h3>
      <div class="form-row">
        <div><label style="font-size:12px;color:var(--muted)">Item</label><select id="o-item">${menu.map(m => `<option value="${m.id}">${m.name} — $${fmt(m.price)}</option>`).join('')}</select></div>
        <div><label style="font-size:12px;color:var(--muted)">Qty</label><input type="number" id="o-qty" value="1" min="1"></div>
        <div><label style="font-size:12px;color:var(--muted)">Type</label><select id="o-type"><option>Dine-in</option><option>Delivery</option><option>Pickup</option></select></div>
        <div><button class="btn btn-primary" onclick="addOrder()">+ Add order</button></div>
      </div></div>
    <div class="panel"><h3>All orders</h3>${ordersTable(orders)}</div>`;
  },
  menu: async () => {
    const menu = await api('/menu');
    return `<div class="panel"><h3>Add item</h3>
      <div class="form-row">
        <div><label style="font-size:12px;color:var(--muted)">Name</label><input id="m-name" placeholder="Item name"></div>
        <div><label style="font-size:12px;color:var(--muted)">Price ($)</label><input type="number" id="m-price" placeholder="0.00"></div>
        <div><label style="font-size:12px;color:var(--muted)">Category</label><input id="m-cat" placeholder="Mains"></div>
        <div><button class="btn btn-primary" onclick="addMenu()">+ Add</button></div>
      </div></div>
    <div class="panel"><h3>Menu items (${menu.length})</h3>
      <table><tr><th>Name</th><th>Category</th><th>Price</th><th></th></tr>
      ${menu.map(m => `<tr><td>${m.name}</td><td><span class="pill b">${m.cat}</span></td><td>$${fmt(m.price)}</td>
      <td><button class="btn btn-red" onclick="delMenu(${m.id})">Delete</button></td></tr>`).join('')}</table></div>`;
  },
  inventory: async () => {
    const inv = await api('/inventory');
    const low = inv.filter(i => i.qty < i.min).length;
    return `<div class="panel"><h3>Add ingredient</h3>
      <div class="form-row">
        <div><label style="font-size:12px;color:var(--muted)">Name</label><input id="i-name" placeholder="Ingredient"></div>
        <div><label style="font-size:12px;color:var(--muted)">Qty</label><input type="number" id="i-qty" placeholder="0"></div>
        <div><label style="font-size:12px;color:var(--muted)">Min level</label><input type="number" id="i-min" placeholder="0"></div>
        <div><label style="font-size:12px;color:var(--muted)">Unit</label><input id="i-unit" placeholder="kg / pcs"></div>
        <div><button class="btn btn-primary" onclick="addInv()">+ Add</button></div>
      </div></div>
    <div class="panel"><h3>Stock (${low} low)</h3>
      <table><tr><th>Ingredient</th><th>In stock</th><th>Min level</th><th></th></tr>
      ${inv.map(i => `<tr><td>${i.name}</td>
      <td class="${i.qty < i.min ? 'stock-low' : ''}">${i.qty} ${i.unit} ${i.qty < i.min ? '⚠️' : ''}</td>
      <td>${i.min} ${i.unit}</td>
      <td><button class="btn btn-blue" onclick="chInv(${i.id},1)">+</button> <button class="btn btn-blue" onclick="chInv(${i.id},-1)">−</button>
      <button class="btn btn-red" onclick="delInv(${i.id})">Delete</button></td></tr>`).join('')}</table></div>`;
  },
  staff: async () => {
    const staff = await api('/staff');
    return `<div class="panel"><h3>Add staff</h3>
      <div class="form-row">
        <div><label style="font-size:12px;color:var(--muted)">Name</label><input id="s-name" placeholder="Full name"></div>
        <div><label style="font-size:12px;color:var(--muted)">Role</label><select id="s-role"><option>Manager</option><option>Cashier</option><option>Chef</option><option>Waiter</option></select></div>
        <div><label style="font-size:12px;color:var(--muted)">Shift</label><select id="s-shift"><option>Morning</option><option>Evening</option></select></div>
        <div><button class="btn btn-primary" onclick="addStaff()">+ Add</button></div>
      </div></div>
    <div class="panel"><h3>Team (${staff.length})</h3>
      <table><tr><th>Name</th><th>Role</th><th>Shift</th><th></th></tr>
      ${staff.map(s => `<tr><td>${s.name}</td><td><span class="pill ${s.role === 'Manager' ? 'o' : 'b'}">${s.role}</span></td><td>${s.shift}</td>
      <td><button class="btn btn-red" onclick="delStaff(${s.id})">Delete</button></td></tr>`).join('')}</table></div>`;
  },
  reports: async () => {
    const [s, orders] = await Promise.all([api('/stats'), api('/orders')]);
    const tot = orders.filter(o => o.status !== 'Cancelled').reduce((a, o) => a + o.total, 0);
    const cnt = orders.filter(o => o.status !== 'Cancelled').length;
    return `<div class="stats">
      <div class="stat"><b>$${fmt(tot)}</b><small>Total revenue</small></div>
      <div class="stat"><b>${cnt}</b><small>Total orders</small></div>
      <div class="stat"><b>$${cnt ? fmt(tot / cnt) : '0.00'}</b><small>Avg order value</small></div>
      <div class="stat"><b>${s.staff}</b><small>Team members</small></div></div>
    <div class="panel"><h3>Sales — last 7 days</h3>${chartHTML(s.weekly)}</div>
    <div class="panel"><h3>Orders by type</h3>
      <table><tr><th>Type</th><th>Count</th><th>Revenue</th></tr>
      ${['Dine-in', 'Delivery', 'Pickup'].map(t => {
        const os = orders.filter(o => o.type === t && o.status !== 'Cancelled');
        return `<tr><td>${t}</td><td>${os.length}</td><td>$${fmt(os.reduce((a, o) => a + o.total, 0))}</td></tr>`;
      }).join('')}</table></div>`;
  },
  settings: async () => {
    const st = await api('/settings');
    const setRow = (k, t, s) => `<div class="set-row"><div><b>${t}</b><br><span>${s}</span></div>
      <div class="switch ${st[k] === '1' ? 'on' : ''}" onclick="toggleSetting('${k}')"></div></div>`;
    return `<div class="panel"><h3>Restaurant info</h3>
      <div class="form-row"><div><label style="font-size:12px;color:var(--muted)">Restaurant name</label><input id="set-name" value="${st.name || ''}"></div>
      <div><button class="btn btn-primary" onclick="saveName()">Save</button></div></div></div>
    <div class="panel"><h3>Features</h3>
      ${setRow('qr', 'QR Digital Menu', 'Guests scan and order from their phones')}
      ${setRow('online', 'Online Ordering', 'Accept delivery & pickup orders online')}
      ${setRow('inventory', 'Inventory Tracking', 'Track ingredients and low-stock alerts')}
      ${setRow('loyalty', 'Loyalty Program', 'Points & rewards for returning guests')}
      ${setRow('kitchen', 'Kitchen Display', 'Auto-route orders to the kitchen screen')}
      ${setRow('autoPrint', 'Auto Receipt Printing', 'Print receipts automatically')}
    </div>`;
  }
};

/* ---- actions ---- */
async function addOrder() {
  await api('/orders', { method: 'POST', body: JSON.stringify({ menu_id: +$('o-item').value, qty: +$('o-qty').value, type: $('o-type').value }) });
  render('orders');
}
async function advOrder(id) {
  const orders = await api('/orders');
  const o = orders.find(x => x.id === id);
  await api('/orders/' + id, { method: 'PATCH', body: JSON.stringify({ status: o.status === 'New' ? 'Preparing' : 'Done' }) });
  render('orders');
}
async function cancelOrder(id) { await api('/orders/' + id, { method: 'DELETE' }); render('orders'); }
async function addMenu() {
  const n = $('m-name').value.trim(); const p = +$('m-price').value;
  if (!n || !p) return;
  await api('/menu', { method: 'POST', body: JSON.stringify({ name: n, price: p, cat: $('m-cat').value.trim() }) });
  render('menu');
}
async function delMenu(id) { await api('/menu/' + id, { method: 'DELETE' }); render('menu'); }
async function addInv() {
  const n = $('i-name').value.trim(); if (!n) return;
  await api('/inventory', { method: 'POST', body: JSON.stringify({ name: n, qty: +$('i-qty').value || 0, min: +$('i-min').value || 0, unit: $('i-unit').value.trim() }) });
  render('inventory');
}
async function chInv(id, d) { await api('/inventory/' + id, { method: 'PATCH', body: JSON.stringify({ delta: d }) }); render('inventory'); }
async function delInv(id) { await api('/inventory/' + id, { method: 'DELETE' }); render('inventory'); }
async function addStaff() {
  const n = $('s-name').value.trim(); if (!n) return;
  await api('/staff', { method: 'POST', body: JSON.stringify({ name: n, role: $('s-role').value, shift: $('s-shift').value }) });
  render('staff');
}
async function delStaff(id) { await api('/staff/' + id, { method: 'DELETE' }); render('staff'); }
async function toggleSetting(k) {
  const st = await api('/settings');
  await api('/settings', { method: 'PUT', body: JSON.stringify({ [k]: st[k] === '1' ? '0' : '1' }) });
  render('settings');
}
async function saveName() {
  await api('/settings', { method: 'PUT', body: JSON.stringify({ name: $('set-name').value }) });
  render('settings');
}

/* ---- init ---- */
(async () => {
  if (token) { const s = await api('/settings'); if (s) { showApp(); render('dashboard'); return; } }
  showLogin();
})();
</script>
</body>
</html>
